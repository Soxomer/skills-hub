name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main, 'codex/**']

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-and-control-plane:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ahm
          POSTGRES_PASSWORD: ahm_ci_disposable
          POSTGRES_DB: ahm_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ahm -d ahm_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      AHM_TEST_DATABASE_URL: postgresql://ahm:ahm_ci_disposable@127.0.0.1:5432/ahm_ci
      AHM_TEST_RUNNER_BIN: ${{ github.workspace }}/target/debug/ahm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .
      - run: cargo build --locked -p ahm-runner --bin ahm
      - run: npm run version:check
      - run: npm run boundary:check
      - run: npm run build:contracts
      - run: npm run lint
      - run: npm run test
      - run: npm run build:control-plane
      - run: npm run build:web
      - run: npm run build --workspace @ahm/helper

  runner-and-cli:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bundle: deb
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            bundle: nsis
          - os: macos-14
            target: aarch64-apple-darwin
            bundle: dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .
      - run: cargo build --locked -p ahm-runner --bin ahm
      - run: node scripts/prepare-helper.mjs --local
      - run: npm run build --workspace @ahm/helper
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: cargo build --locked -p ahm-runner --bin ahm
      - run: node scripts/test-worker-lifecycle.mjs
      - name: Build desktop helper bundle
        run: |
          npm run tauri --workspace @ahm/helper -- build --debug --bundles ${{ matrix.bundle }}
          node scripts/package-helper.mjs ${{ matrix.target }} debug
      - name: Verify Windows install, upgrade and uninstall
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/test-windows-installer.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: helper-test-${{ matrix.target }}
          path: target/release-assets/*
