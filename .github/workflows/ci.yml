name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main, 'codex/**']

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-and-control-plane:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ahm
          POSTGRES_PASSWORD: ahm_ci_disposable
          POSTGRES_DB: ahm_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ahm -d ahm_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      AHM_TEST_DATABASE_URL: postgresql://ahm:ahm_ci_disposable@127.0.0.1:5432/ahm_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run version:check
      - run: npm run boundary:check
      - run: npm run build:contracts
      - run: npm run lint
      - run: npm run test
      - run: npm run build:control-plane
      - run: npm run build:web

  runner-and-cli:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace
