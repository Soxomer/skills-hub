name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  verify-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run version:check
      - run: npm run build:contracts
      - run: npm run build:control-plane
      - run: npm run build:web

  runner-binaries:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            extension: ""
          - os: macos-14
            target: aarch64-apple-darwin
            extension: ""
          - os: macos-14
            target: x86_64-apple-darwin
            extension: ""
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            extension: .exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .
          key: ${{ matrix.target }}
      - name: Build ahm
        run: cargo build --release --package ahm-runner --bin ahm --target ${{ matrix.target }}
      - name: Package ahm
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          archive="ahm-${GITHUB_REF_NAME}-${{ matrix.target }}.tar.gz"
          cp "target/${{ matrix.target }}/release/ahm${{ matrix.extension }}" "release-assets/ahm${{ matrix.extension }}"
          tar -C release-assets -czf "release-assets/${archive}" "ahm${{ matrix.extension }}"
          rm "release-assets/ahm${{ matrix.extension }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ahm-${{ matrix.target }}
          path: release-assets/*.tar.gz
          if-no-files-found: error

  publish:
    runs-on: ubuntu-latest
    needs: [verify-web, runner-binaries]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: ahm-*
          merge-multiple: true
      - name: Generate release notes
        shell: bash
        run: node scripts/extract-changelog.mjs "${GITHUB_REF_NAME}" CHANGELOG.md > release-notes.md
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Agent Harness Manager ${{ github.ref_name }}
          prerelease: ${{ contains(github.ref_name, '-') }}
          body_path: release-notes.md
          files: release-assets/*
