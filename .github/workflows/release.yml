name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  verify-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run version:check
      - run: npm run build:contracts
      - run: npm run build:control-plane
      - run: npm run build:web

  runner-binaries:
    env:
      RUSTFLAGS: ${{ matrix.os == 'windows-2022' && '-C target-feature=+crt-static' || '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            extension: ""
            bundle: deb
          - os: macos-14
            target: aarch64-apple-darwin
            extension: ""
            bundle: dmg
          - os: macos-14
            target: x86_64-apple-darwin
            extension: ""
            bundle: dmg
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            extension: .exe
            bundle: nsis
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .
          key: ${{ matrix.target }}
      - name: Build ahm
        run: cargo build --locked --release --package ahm-runner --bin ahm --target ${{ matrix.target }}
      - run: node scripts/prepare-helper.mjs ${{ matrix.target }} release
      - name: Build desktop helper bundle
        run: npm run tauri --workspace @ahm/helper -- build --target ${{ matrix.target }} --bundles ${{ matrix.bundle }}
      - run: node scripts/package-helper.mjs ${{ matrix.target }} release
      - name: Package ahm
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/release-assets
          archive="ahm-${GITHUB_REF_NAME}-${{ matrix.target }}.tar.gz"
          tar -C "target/${{ matrix.target }}/release" -czf "target/release-assets/${archive}" "ahm${{ matrix.extension }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ahm-${{ matrix.target }}
          path: target/release-assets/*
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: [verify-web, runner-binaries]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: ahm-*
          merge-multiple: true
      - name: Generate release notes
        shell: bash
        run: node scripts/extract-changelog.mjs "${GITHUB_REF_NAME}" CHANGELOG.md > release-notes.md
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Agent Harness Manager ${{ github.ref_name }}
          prerelease: ${{ contains(github.ref_name, '-') }}
          body_path: release-notes.md
          files: release-assets/*
