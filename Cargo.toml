[workspace]
members = [
  "src-tauri",
  "crates/ahm-domain",
  "crates/ahm-runner",
]
resolver = "2"

[workspace.package]
edition = "2021"
rust-version = "1.77.2"

[workspace.dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive", "env"] }
dirs = "5.0"
hex = "0.4"
junction = "1.1"
log = "0.4"
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
walkdir = "2.5"
