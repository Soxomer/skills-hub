[workspace]
members = [
  "src-tauri",
  "crates/ahm-domain",
  "crates/ahm-runner",
]
resolver = "2"

[workspace.package]
edition = "2021"
rust-version = "1.77.2"

[workspace.dependencies]
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
